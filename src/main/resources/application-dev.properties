# Development Profile Configuration
# Note: For local development, create a .env file or set environment variables

# Frontend URL for CORS
FRONTEND_URL=http://localhost:3000

# Database - defaults for local development (override via environment)
spring.datasource.url=${DB_HOST:jdbc:postgresql://localhost:5432/triveni_mgmt_db}
spring.datasource.username=${DB_USER:proha}
spring.datasource.password=${DB_PASSWORD:gosaikunda}

# JPA - create-drop for development
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Liquibase - disabled in dev to let Hibernate manage schema
spring.liquibase.enabled=false

# Error handling - show stack traces in dev
server.error.include-stacktrace=always

# JWT - defaults for development (MUST override in production)
jwt.secret=${JWT_SECRET:dev-only-secret-key-minimum-32-characters-long}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.issuer=${JWT_ISSUER:http://localhost:8080}

# Swagger/OpenAPI - enabled in dev
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.enabled=true

# CORS
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With,X-Store-Id,X-Organization-Id,X-Correlation-ID
spring.web.cors.exposed-headers=Set-Cookie,X-Correlation-ID
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Logging - balanced for dev (app debug, frameworks at info/warn)
logging.level.com.store.mgmt=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
# Uncomment below to debug SQL queries when needed:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# DevTools
spring.devtools.restart.enabled=true

# Request logging enabled in dev
logging.request.enabled=true
