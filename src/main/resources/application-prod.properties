# Production Profile Configuration
# ALL sensitive values MUST be set via environment variables

# Database - REQUIRED environment variables
spring.datasource.url=${DB_HOST}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool - tuned for production
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA - validate only, never auto-create in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Liquibase - enabled for controlled migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Error handling - never expose stack traces in production
server.error.include-stacktrace=never
server.error.include-message=never

# JWT - REQUIRED environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.issuer=${JWT_ISSUER}

# Swagger/OpenAPI - DISABLED in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# CORS - REQUIRED environment variable
spring.web.cors.allowed-origins=${FRONTEND_URL}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With,X-Store-Id,X-Organization-Id,X-Correlation-ID
spring.web.cors.exposed-headers=Set-Cookie,X-Correlation-ID
spring.web.cors.allow-credentials=true

# Server
server.port=${SERVER_PORT:8080}

# Logging - minimal in production
logging.level.root=WARN
logging.level.com.store.mgmt=INFO
logging.level.org.springframework.security=WARN

# Actuator - limited exposure in production
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Security headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Compression for better performance
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024
