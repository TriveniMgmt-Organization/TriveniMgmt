spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
  liquibase:
    enabled: false
  mail:
    host: localhost
    port: 25

# JWT configuration for tests
jwt:
  secret: test-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-for-hs256
  access-token-expiration: 3600000
  refresh-token-expiration: 86400000

# Disable caching in tests
spring.cache.type: none

logging:
  level:
    root: WARN
    com.store.mgmt: DEBUG
    org.springframework.security: DEBUG
